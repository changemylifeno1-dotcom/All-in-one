<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4"/>
  
  <!-- Outer accent ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-dasharray="24 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Glowing Core -->
  <circle cx="256" cy="256" r="130" fill="#18181b" filter="url(#glow)"/>

  <!-- R Symbol with Play Triangle -->
  <g transform="translate(180, 160)">
    <!-- R vertical bar -->
    <rect x="0" y="0" width="28" height="190" rx="14" fill="url(#primaryGrad)"/>
    <!-- R top loop -->
    <path d="M 28 20 C 80 20, 100 50, 100 80 C 100 110, 80 130, 28 130" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round"/>
    <!-- R diagonal leg / play arrow accent -->
    <path d="M 40 120 L 105 190" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round"/>
    <!-- Center Play Icon -->
    <polygon points="120,70 155,95 120,120" fill="url(#emeraldGrad)"/>
  </g>

  <!-- 'ONE' Badge -->
  <rect x="290" y="310" width="70" height="28" rx="14" fill="url(#emeraldGrad)"/>
  <text x="325" y="329" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">ONE</text>
</svg>
