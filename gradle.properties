# AndroidX package structure configuration
# Enables the use of AndroidX libraries across all modules and dependencies
android.useAndroidX=true

# Automatically convert third-party libraries using Android Support Library to AndroidX
android.enableJetifier=true

# Enables non-transitive R class namespacing for faster incremental compilation
android.nonTransitiveRClass=true

# Kotlin and Gradle JVM optimization
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
